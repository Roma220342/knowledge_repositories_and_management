name: quality-gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt pytest jsonschema
      - name: Quality gate (блокує злиття при порушеннях)
        run: python3 quality/gate.py ci data/store_v1.jsonl data/graph_v1
      - uses: actions/upload-artifact@v4
        with: { name: quality-report, path: quality/report_ci.md }
